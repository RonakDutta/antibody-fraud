services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: contextcon
      POSTGRES_PASSWORD: contextcon_local
      POSTGRES_DB: contextcon
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextcon -d contextcon"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
